name: Curate continent photo assets
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/continent-photo-assets.yml'
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet pillow requests
      - name: Download and optimize 7 licensed continent photos (premium refresh)
        env:
          GV_PHOTO_DATA: '[{"slug":"asia","file":"Sunset Glow on Mount Everest.jpg","author":"Megaurab09","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0/"},{"slug":"africa","file":"Acacia tree on a sunrise safari at the Serengeti National Park, Tanzania.jpg","author":"Daniel Zaas","license":"Public domain","licenseUrl":"https://creativecommons.org/publicdomain/mark/1.0/"},{"slug":"europe","file":"Lauterbrunnen Valley (50094290591).jpg","author":"kuhnmi","license":"CC BY 2.0","licenseUrl":"https://creativecommons.org/licenses/by/2.0/"},{"slug":"north-america","file":"Grand Canyon Afternoon Blue Sky.jpg","author":"MichaelKirsh","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0/"},{"slug":"south-america","file":"Amazon CIAT (5).jpg","author":"Neil Palmer / CIAT","license":"CC BY-SA 2.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/2.0/"},{"slug":"oceania","file":"Bora Bora Airport.jpg","author":"Elizabeth.guterson","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0/"},{"slug":"antarctica","file":"Penguins in Baily''s Head, overlooking Livingston Island - Deception Island, Antarctica.jpg","author":"GinjaLouro","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0/"}]'
        run: |
          python - <<'PY'
          import os, io, json, time
          from pathlib import Path
          from urllib.parse import quote
          from PIL import Image, ImageOps, ImageEnhance, ImageFilter
          import requests
          photos=json.loads(os.environ["GV_PHOTO_DATA"])
          out=Path("assets/continent-photos");out.mkdir(parents=True,exist_ok=True)
          session=requests.Session();session.headers.update({"User-Agent":"GeoVerseEducationalAtlas/1.0 (image licensing audit; GitHub Actions)"})
          dimensions=[]
          for item in photos:
              name=item["file"]
              url="https://commons.wikimedia.org/wiki/Special:Redirect/file/"+quote(name.replace(" ","_"))+"?width=2600"
              response=None
              for attempt in range(4):
                  try:
                      response=session.get(url,timeout=45,allow_redirects=True)
                      response.raise_for_status()
                      if not response.headers.get("Content-Type","").startswith("image/"):raise RuntimeError("Non-image response")
                      break
                  except Exception:
                      if attempt==3:raise
                      time.sleep(3*(attempt+1))
              with Image.open(io.BytesIO(response.content)) as img:
                  img=ImageOps.exif_transpose(img).convert("RGB")
                  img.thumbnail((2500,1800),Image.Resampling.LANCZOS)
                  if item["slug"] != "oceania":
                      img=ImageEnhance.Contrast(img).enhance(1.07)
                      img=ImageEnhance.Color(img).enhance(1.06)
                      img=img.filter(ImageFilter.UnsharpMask(radius=1.3,percent=95,threshold=3))
                  dest=out/(item["slug"]+".webp")
                  img.save(dest,"WEBP",quality=94,method=6)
                  assert dest.stat().st_size>15000, dest
                  print(item["slug"],"HQ dimensions",img.size,"bytes",dest.stat().st_size)
                  dimensions.append({"slug":item["slug"],"width":img.width,"height":img.height,"bytes":dest.stat().st_size})
          (out/"IMAGE-SIZES.json").write_text(json.dumps(dimensions,indent=2)+"\\n",encoding="utf-8")
          credits=["# Continent images — licenses and attribution","Images sourced from Wikimedia Commons. Displayed in GeoVerse continent cards and detail pages. Source images have been resized and converted to WebP.\n"]
          for item in photos:
              title=item["file"].replace(" ","_")
              credits.append(f"- **{item['slug']}**: [{item['file']}](https://commons.wikimedia.org/wiki/File:{quote(title)}) by {item['author']} — [{item['license']}]({item['licenseUrl']}); resized and converted to WebP.")
          (out/"ATTRIBUTION.md").write_text("\n".join(credits)+"\n",encoding="utf-8")
          PY
      - name: Commit curated photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/continent-photos
          if ! git diff --cached --quiet; then
            git commit -m "assets: store seven optimized licensed continent photographs"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              echo "Concurrent commit during image archive publish; retrying $attempt/5"
              sleep 3
            done
            echo "Image archive push failed after 5 attempts" >&2
            exit 1
          fi
