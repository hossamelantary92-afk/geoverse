<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="ttl desc">
<title id="ttl">كيف ينشأ المد والجزر؟</title><desc id="desc">الأرض في وسط رسم مع انتفاخين مائيين متقابلين أحدهما جهة القمر والآخر في الجهة البعيدة، وجزر نسبي عند الجانبين المتعامدين. تمثيل مبسط وغير مطابق للمقياس.</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#0a253d"/><stop offset="1" stop-color="#031426"/></linearGradient>
 <radialGradient id="water"><stop stop-color="#1674af"/><stop offset=".67" stop-color="#108dd0"/><stop offset="1" stop-color="#35c9ea"/></radialGradient>
 <radialGradient id="earth" cx=".28" cy=".25"><stop stop-color="#67c5e8"/><stop offset=".69" stop-color="#146d9f"/><stop offset="1" stop-color="#063358"/></radialGradient>
 <radialGradient id="moon" cx=".3" cy=".25"><stop stop-color="#e6eff4"/><stop offset=".8" stop-color="#8497a8"/><stop offset="1" stop-color="#546777"/></radialGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="9"/></filter>
</defs>
<rect width="1000" height="650" rx="25" fill="url(#sky)"/>
<g fill="#bce8ff" opacity=".6"><circle cx="68" cy="126" r="2"/><circle cx="153" cy="203" r="1.5"/><circle cx="906" cy="108" r="2"/><circle cx="930" cy="524" r="1.6"/><circle cx="90" cy="496" r="1.8"/><circle cx="698" cy="74" r="1.5"/></g>
<text x="500" y="66" text-anchor="middle" direction="rtl" fill="#f2fcff" font-size="39" font-weight="800" font-family="Tahoma,Arial,sans-serif">المد والجزر: لماذا يرتفع الماء على جانبين؟</text>
