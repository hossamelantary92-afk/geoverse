<circle cx="833" cy="337" r="66" fill="url(#moon)" stroke="#c3d3e0" stroke-width="3"/>
<g fill="#667c8d" opacity=".48"><circle cx="811" cy="314" r="15"/><circle cx="861" cy="345" r="19"/><circle cx="829" cy="375" r="12"/><circle cx="851" cy="291" r="8"/></g>
<line x1="697" y1="337" x2="755" y2="337" stroke="#aed4df" stroke-dasharray="9 9" stroke-width="3"/>
<g font-family="Tahoma,Arial,sans-serif" text-anchor="middle" direction="rtl" font-weight="700">
<text x="443" y="345" fill="#fff" font-size="29">الأرض</text>
<text x="833" y="440" fill="#eaf9ff" font-size="27">القمر</text>
