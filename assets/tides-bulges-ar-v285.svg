<text x="140" y="304" fill="#b3fbfa" font-size="24">مد مرتفع</text>
<rect x="569" y="188" width="180" height="58" rx="16" fill="#12394f" stroke="#67def4" stroke-width="2"/>
<text x="659" y="226" fill="#b3fbfa" font-size="24">مد مرتفع</text>
