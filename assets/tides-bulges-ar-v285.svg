<text x="444" y="167" fill="#ddd7ff" font-size="23">جزر نسبي</text>
<rect x="350" y="486" width="188" height="54" rx="15" fill="#263147" stroke="#b0a8f6" stroke-width="2"/>
<text x="444" y="521" fill="#ddd7ff" font-size="23">جزر نسبي</text>
</g>
<path d="M223 297 L261 318 M591 243 L630 280 M443 187 L443 214 M443 464 L443 485" fill="none" stroke="#d2edfa" stroke-width="2.5" stroke-linecap="round"/>
