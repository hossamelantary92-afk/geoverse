<text x="500" y="603" direction="rtl" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="20" fill="#d3edf5">رسم مبسط وغير مرسوم بمقياس حقيقي — المد الفعلي يختلف حسب السواحل</text>
</svg>