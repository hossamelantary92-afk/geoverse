<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title description">
<title id="title">أنواع المجرات الثلاثة</title>
<desc id="description">مخطط عربي مقارن يوضح مجرة حلزونية لها أذرع وقرص، ومجرة إهليلجية ذات توزيع بيضاوي ناعم للنجوم، ومجرة غير منتظمة لا تملك شكلًا هندسيًا واضحًا. الأشكال تعليمية وليست بمقياس حقيقي.</desc>
<defs>
<linearGradient id="bg" x2="0" y2="1"><stop stop-color="#0b2942"/><stop offset="1" stop-color="#041323"/></linearGradient>
<radialGradient id="ell"><stop stop-color="#fff4d7" stop-opacity=".96"/><stop offset=".5" stop-color="#e1b48b" stop-opacity=".72"/><stop offset="1" stop-color="#b88e78" stop-opacity=".03"/></radialGradient>
<radialGradient id="core"><stop stop-color="#fff6cf"/><stop offset=".35" stop-color="#d9c9f2"/><stop offset="1" stop-color="#647db5" stop-opacity="0"/></radialGradient>
<filter id="blur"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<rect width="1000" height="620" rx="26" fill="url(#bg)"/>
<text x="500" y="66" direction="rtl" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="41" font-weight="bold" fill="#f4fbff">الأنواع الرئيسية للمجرات</text>
<g fill="#d5f0ff" opacity=".6"><circle cx="79" cy="100" r="2"/><circle cx="228" cy="111" r="1.5"/><circle cx="698" cy="107" r="1.7"/><circle cx="939" cy="92" r="2"/><circle cx="160" cy="534" r="1.5"/><circle cx="490" cy="539" r="1.5"/><circle cx="823" cy="546" r="1.8"/></g>
<g fill="#071e34" stroke="#47748c" stroke-width="2">
<rect x="24" y="104" width="304" height="457" rx="21"/><rect x="348" y="104" width="304" height="457" rx="21"/><rect x="672" y="104" width="304" height="457" rx="21"/>
</g>
<!-- Spiral galaxy with arms and central bar -->
<g transform="translate(176 295)">
<path d="M-4 -1 C-64 -37 -133 -3 -113 64 C-101 94 -57 111 -18 94 M4 1 C67 33 132 -1 112 -67 C101 -98 58 -110 17 -90" fill="none" stroke="#a3c6fc" stroke-width="28" opacity=".3" filter="url(#blur)"/>
<path d="M-3 0 C-68 -43 -139 -2 -115 65 C-92 125 -6 109 38 80 M4 1 C66 41 143 -4 116 -67 C93 -121 7 -109 -38 -78" fill="none" stroke="#76b5f8" stroke-width="18" opacity=".62" stroke-linecap="round"/>
<path d="M-8 0 C-65 -32 -115 -12 -105 48 M8 0 C65 32 115 12 105 -48" fill="none" stroke="#e9edf8" stroke-width="9" opacity=".56"/>
<ellipse rx="48" ry="28" fill="url(#core)"/><ellipse rx="28" ry="10" fill="#f8e8c5" opacity=".9"/>
<g fill="#e9f6ff" opacity=".9"><circle cx="-100" cy="33" r="3"/><circle cx="-74" cy="-33" r="3"/><circle cx="104" cy="-38" r="4"/><circle cx="91" cy="51" r="3"/><circle cx="22" cy="75" r="3"/><circle cx="-12" cy="-69" r="3"/></g>
</g>
<!-- Elliptical galaxy: smoothly distributed stars, no arms -->
<g transform="translate(500 292)">
<ellipse rx="124" ry="78" fill="url(#ell)" transform="rotate(-20)" opacity=".87"/>
<ellipse rx="108" ry="65" fill="url(#ell)" transform="rotate(-20)" opacity=".6"/>
<ellipse rx="76" ry="45" fill="#ffddba" opacity=".28" transform="rotate(-20)"/>
<g fill="#ffedd5" opacity=".8"><circle cx="-82" cy="8" r="2.4"/><circle cx="-46" cy="-43" r="2.7"/><circle cx="69" cy="-30" r="2.3"/><circle cx="88" cy="23" r="2.1"/><circle cx="-20" cy="56" r="2.3"/><circle cx="30" cy="3" r="3.4"/></g>
</g>
<!-- Irregular galaxy clusters: asymmetric luminous star-forming patches -->
<g transform="translate(824 295)">
<path d="M-115 17 Q-146 -28 -89 -60 Q-61 -107 -8 -75 Q17 -46 63 -54 Q109 -25 86 24 Q121 73 62 92 Q14 119 -13 72 Q-76 116 -102 52 Z" fill="#477ec7" opacity=".42" filter="url(#blur)"/>
<path d="M-113 8 Q-100 -51 -51 -63 Q-17 -20 18 -59 Q66 -77 84 -9 Q49 7 78 46 Q21 88 -11 49 Q-64 106 -102 38 Z" fill="#7eb4e9" opacity=".52"/>
<g fill="#a7cfff"><circle cx="-69" cy="-40" r="23" opacity=".6"/><circle cx="46" cy="-24" r="16" opacity=".7"/><circle cx="18" cy="43" r="23" opacity=".52"/><circle cx="-58" cy="31" r="13" opacity=".8"/></g>
<g fill="#f9e4c3"><circle cx="-79" cy="-38" r="4"/><circle cx="-34" cy="-9" r="3"/><circle cx="47" cy="-24" r="5"/><circle cx="18" cy="42" r="5"/><circle cx="86" cy="26" r="3"/><circle cx="-62" cy="29" r="4"/></g>
</g>
<g direction="rtl" text-anchor="middle" font-family="Tahoma,Arial,sans-serif">
<text x="176" y="446" fill="#a4f4e8" font-weight="800" font-size="29">حلزونية</text>
<text x="500" y="446" fill="#a4f4e8" font-weight="800" font-size="29">إهليلجية</text>
<text x="824" y="446" fill="#a4f4e8" font-weight="800" font-size="29">غير منتظمة</text>
<text x="176" y="485" fill="#d3e8f1" font-size="19">قرص وأذرع لولبية</text>
<text x="500" y="485" fill="#d3e8f1" font-size="19">توزيع بيضاوي للنجوم</text>
<text x="824" y="485" fill="#d3e8f1" font-size="19">دون شكل محدد</text>
<text x="500" y="594" fill="#9bc3d5" font-size="18">أشكال تعليمية مبسطة — المجرات الحقيقية أكثر تنوعًا</text>
</g></svg>