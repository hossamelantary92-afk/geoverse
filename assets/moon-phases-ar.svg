<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 610" role="img" aria-labelledby="title description"><title id="title">أطوار القمر الثمانية</title><desc id="description">الترتيب من اليمين إلى اليسار في كل صف: المحاق، الهلال المتزايد، التربيع الأول، الأحدب المتزايد، البدر، الأحدب المتناقص، التربيع الأخير، الهلال المتناقص. الرسم تخطيطي كما تُرى الأطوار من نصف الكرة الشمالي.</desc><rect width="1080" height="610" fill="#071b30"/><text x="540" y="66" text-anchor="middle" fill="#9af1e5" font-size="40" font-weight="bold">أطوار القمر</text><text x="540" y="100" text-anchor="middle" fill="#afc9d9" font-size="20">دورة تتكرر كل 29.5 يوم تقريبًا</text><g><circle cx="930" cy="210" r="62" fill="#142a3d" stroke="#7594a9" stroke-width="1.5"/><text x="930" y="301" text-anchor="middle" font-size="25" font-weight="700" fill="#e6f6ff">المحاق</text></g><g><circle cx="670" cy="210" r="62" fill="#142a3d" stroke="#7594a9" stroke-width="1.5"/><path d="M 670 148 A 62 62 0 0 1 670 272 Q 512.3 210 670 148 Z" fill="#e4e6dc"/><text x="670" y="301" text-anchor="middle" font-size="25" font-weight="700" fill="#e6f6ff">الهلال المتزايد</text></g><g><circle cx="410" cy="210" r="62" fill="#142a3d" stroke="#7594a9" stroke-width="1.5"/><path d="M 410 148 A 62 62 0 0 1 410 272 Q 410 210 410 148 Z" fill="#e4e6dc"/><text x="410" y="301" text-anchor="middle" font-size="25" font-weight="700" fill="#e6f6ff">التربيع الأول</text></g><g><circle cx="150" cy="210" r="62" fill="#142a3d" stroke="#7594a9" stroke-width="1.5"/><path d="M 150 148 A 62 62 0 0 1 150 272 Q 838.24 210 150 148 Z" fill="#e4e6dc"/><text x="150" y="301" text-anchor="middle" font-size="25" font-weight="700" fill="#e6f6ff">الأحدب المتزايد</text></g><g><circle cx="930" cy="425" r="62" fill="#142a3d" stroke="#7594a9" stroke-width="1.5"/><circle cx="930" cy="425" r="61" fill="#e4e6dc"/><text x="930" y="516" text-anchor="middle" font-size="25" font-weight="700" fill="#e6f6ff">البدر</text></g><g><circle cx="670" cy="425" r="62" fill="#142a3d" stroke="#7594a9" stroke-width="1.5"/><path d="M 670 363 A 62 62 0 0 0 670 487 Q 501.76 425 670 363 Z" fill="#e4e6dc"/><text x="670" y="516" text-anchor="middle" font-size="25" font-weight="700" fill="#e6f6ff">الأحدب المتناقص</text></g><g><circle cx="410" cy="425" r="62" fill="#142a3d" stroke="#7594a9" stroke-width="1.5"/><path d="M 410 363 A 62 62 0 0 0 410 487 Q 410 425 410 363 Z" fill="#e4e6dc"/><text x="410" y="516" text-anchor="middle" font-size="25" font-weight="700" fill="#e6f6ff">التربيع الأخير</text></g><g><circle cx="150" cy="425" r="62" fill="#142a3d" stroke="#7594a9" stroke-width="1.5"/><path d="M 150 363 A 62 62 0 0 0 150 487 Q 827.7 425 150 363 Z" fill="#e4e6dc"/><text x="150" y="516" text-anchor="middle" font-size="25" font-weight="700" fill="#e6f6ff">الهلال المتناقص</text></g><text x="540" y="573" text-anchor="middle" fill="#a9c7d5" font-size="17">رسم توضيحي — المظهر المعتاد في نصف الكرة الشمالي</text></svg>