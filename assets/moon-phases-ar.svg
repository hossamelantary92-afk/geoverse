<svg xmlns="http://www.w3.org/2000/svg" width="900" height="930" viewBox="0 0 900 930" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">دورة أطوار القمر الثمانية</title>
<desc id="diagram-desc">مخطط دائري يبدأ بالمحاق من الأعلى، ثم الهلال المتزايد والتربيع الأول والأحدب المتزايد والبدر والأحدب المتناقص والتربيع الأخير والهلال المتناقص باتجاه عقارب الساعة. الأرض في الوسط. المظاهر كما تُرى عادة من نصف الكرة الشمالي. الرسم ليس بمقياس فلكي.</desc>
