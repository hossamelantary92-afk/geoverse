<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="ttl desc">
<title id="ttl">المد القوي والمد الضعيف</title><desc id="desc">في المحاق والبدر تكون الشمس والقمر على استقامة واحدة مع الأرض، فيزيد مدى المد. وعند التربيعين تكون جهتا الشمس والقمر متعامدتين تقريبًا، فيقل مدى المد. رسم توضيحي غير مطابق للمقياس.</desc>
<defs><linearGradient id="back" x2="0" y2="1"><stop stop-color="#0b2b42"/><stop offset="1" stop-color="#04172a"/></linearGradient><radialGradient id="sun"><stop stop-color="#fff1a5"/><stop offset="1" stop-color="#f09c26"/></radialGradient><radialGradient id="earth"><stop stop-color="#64c1db"/><stop offset="1" stop-color="#07578c"/></radialGradient><radialGradient id="moon"><stop stop-color="#d5e1e7"/><stop offset="1" stop-color="#667d91"/></radialGradient></defs>
<rect width="1000" height="720" rx="26" fill="url(#back)"/>
<text x="500" y="59" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="37" font-weight="bold" fill="#fff">مقارنة مدى المد والجزر</text>
<rect x="22" y="90" width="468" height="548" rx="23" fill="#0d2c42" stroke="#78cce8" stroke-width="3"/>
<rect x="510" y="90" width="468" height="548" rx="23" fill="#12233f" stroke="#b6a6fb" stroke-width="3"/>
<g font-family="Tahoma,Arial,sans-serif" direction="rtl" text-anchor="middle" font-weight="bold">
<text x="256" y="140" font-size="30" fill="#a5efff">المد الضعيف</text>
<text x="256" y="177" font-size="21" fill="#c8e3f2">عند التربيعين</text>
<text x="744" y="140" font-size="30" fill="#e2d5ff">المد القوي</text>
<text x="744" y="177" font-size="21" fill="#c8e3f2">عند المحاق أو البدر</text></g>
<!-- NEAP: Sun and Moon at approx 90 degrees from Earth -->
<circle cx="83" cy="336" r="37" fill="url(#sun)"/><circle cx="293" cy="235" r="27" fill="url(#moon)"/>
<ellipse cx="293" cy="348" rx="82" ry="68" fill="#20a3df" opacity=".75" stroke="#6eddf2" stroke-width="3"/>
<circle cx="293" cy="348" r="62" fill="url(#earth)"/>
<path d="M83 336 H210 M293 263 V281" stroke="#c8d7f6" stroke-width="3" stroke-dasharray="8 8"/>
<path d="M253 300 V283 H271" fill="none" stroke="#c6f3ff" stroke-width="3"/>
<!-- SPRING: Sun, Earth and Moon aligned -->
<circle cx="572" cy="348" r="37" fill="url(#sun)"/>
<ellipse cx="744" cy="348" rx="117" ry="70" fill="#2eaeed" opacity=".8" stroke="#91eafd" stroke-width="3"/>
<circle cx="744" cy="348" r="62" fill="url(#earth)"/><circle cx="914" cy="348" r="27" fill="url(#moon)"/>
<path d="M609 348 H627 M861 348 H887" stroke="#d2e6f8" stroke-dasharray="8 8" stroke-width="3"/>
<g direction="rtl" font-family="Tahoma,Arial,sans-serif" text-anchor="middle" fill="#e3f8ff" font-size="20"><text x="83" y="393">الشمس</text><text x="293" y="241" dy="-43">القمر</text><text x="293" y="358">الأرض</text><text x="572" y="395">الشمس</text><text x="744" y="358">الأرض</text><text x="914" y="400">القمر</text></g>
<g font-family="Tahoma,Arial,sans-serif" text-anchor="middle" direction="rtl">
<rect x="77" y="452" width="355" height="126" rx="18" fill="#163e55" stroke="#6aabc2"/>
<text x="254" y="499" font-size="27" font-weight="bold" fill="#b8f4fd">مدى مدّي أصغر</text><text x="254" y="542" font-size="20" fill="#d9ebf3">فرق أقل بين المد والجزر</text>
<rect x="565" y="452" width="355" height="126" rx="18" fill="#2c345d" stroke="#9b9bda"/>
<text x="742" y="499" font-size="27" font-weight="bold" fill="#eddaff">مدى مدّي أكبر</text><text x="742" y="542" font-size="20" fill="#d9ebf3">فرق أكبر بين المد والجزر</text>
</g>
<text x="500" y="674" direction="rtl" text-anchor="middle" fill="#f8e8c5" font-family="Tahoma,Arial,sans-serif" font-size="22">«المد الربيعي» لا يعني فصل الربيع — هو المد ذو المدى الأكبر</text>
</svg>