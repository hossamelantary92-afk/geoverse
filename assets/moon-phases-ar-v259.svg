<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1020" viewBox="0 0 960 1020" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">دورة أطوار القمر واتجاه ضوء الشمس</title>
<desc id="chart-desc">الأرض في مركز المدار، والشمس ناحية اليمين. تبدأ أطوار القمر من المحاق عند يمين الأرض، ثم الهلال المتزايد والتربيع الأول والأحدب المتزايد والبدر والأحدب المتناقص والتربيع الأخير والهلال المتناقص، بعكس اتجاه عقارب الساعة كما ينظر إلى مدار القمر من الشمال. يظهر النصف المنير من القمر حسب منظور الرصد من نصف الكرة الشمالي، وليس حسب الظل الأرضي.</desc>
